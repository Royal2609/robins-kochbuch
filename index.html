<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍽️ Essen-Bibliothek</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── Reset & Tokens ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #e8602c;
      --brand-dark: #c0392b;
      --bg: #f5f0eb;
      --surface: #ffffff;
      --border: #e0d8d0;
      --text: #2d2d2d;
      --muted: #888;
      --radius: 1rem;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.16);
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }

    /* ── Config Banner ── */
    #configBanner {
      background: #fff3cd;
      border-bottom: 2px solid #ffc107;
      padding: 0.75rem 1.5rem;
      font-size: 0.88rem;
      color: #664d03;
      text-align: center;
    }
    #configBanner strong { color: #c0392b; }
    #configBanner code { background: #ffeaa7; padding: 0.1rem 0.4rem; border-radius: 0.3rem; font-size: 0.82rem; }

    /* ── Login Page ── */
    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: linear-gradient(135deg, #fdf3ee 0%, #f5f0eb 100%);
    }
    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo { font-size: 3.5rem; margin-bottom: 0.5rem; }
    .login-card h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 0.35rem; }
    .form-group input {
      width: 100%; padding: 0.7rem 0.9rem;
      border: 2px solid var(--border); border-radius: 0.6rem;
      font-size: 0.95rem; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--brand); }
    .btn-login {
      width: 100%; padding: 0.8rem;
      background: var(--brand); color: white;
      border: none; border-radius: 0.6rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }
    .btn-login:hover { background: var(--brand-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error {
      background: #fee; color: #c0392b;
      border-radius: 0.5rem; padding: 0.65rem 1rem;
      font-size: 0.85rem; margin-top: 0.75rem;
      display: none;
    }

    /* ── App Shell ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white; padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .app-header h1 { font-size: 1.3rem; font-weight: 700; }
    .app-header p { font-size: 0.78rem; opacity: 0.8; }
    .btn-logout {
      background: rgba(255,255,255,0.2); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 2rem;
      padding: 0.35rem 0.9rem; font-size: 0.82rem; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.35); }

    /* Toolbar */
    .toolbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem; display: flex; gap: 0.75rem;
      align-items: center; flex-wrap: wrap;
    }
    .search-wrap { flex: 1; min-width: 180px; position: relative; }
    .search-wrap::before { content: '🔍'; position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); font-size: 0.8rem; }
    .search-wrap input {
      width: 100%; padding: 0.55rem 0.9rem 0.55rem 2.3rem;
      border: 2px solid var(--border); border-radius: 2rem;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--brand); }

    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag {
      padding: 0.35rem 0.8rem; border-radius: 2rem;
      border: 2px solid var(--border); background: white;
      cursor: pointer; font-size: 0.8rem; font-weight: 500;
      color: #666; transition: all 0.15s;
    }
    .tag:hover, .tag.active { background: var(--brand); border-color: var(--brand); color: white; }

    .btn-add {
      padding: 0.55rem 1.2rem; background: var(--brand); color: white;
      border: none; border-radius: 2rem; cursor: pointer;
      font-size: 0.88rem; font-weight: 700; white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--brand-dark); }

    /* Stats */
    .stats { padding: 0.6rem 1.5rem; font-size: 0.82rem; color: var(--muted); background: #faf7f4; border-bottom: 1px solid var(--border); }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem; padding: 1.5rem;
    }

    /* Card */
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .card-emoji { font-size: 3.5rem; text-align: center; padding: 1.25rem; background: linear-gradient(135deg, #fdf3ee, #fde8df); }
    .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .card-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.3; }
    .card-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .badge { font-size: 0.7rem; padding: 0.18rem 0.55rem; border-radius: 1rem; font-weight: 600; text-transform: uppercase; }
    .b-cat { background: #fde8df; color: #c0392b; }
    .b-time { background: #e8f4fd; color: #2980b9; }
    .b-kcal { background: #eafaf1; color: #27ae60; }
    .b-prot { background: #fef9e7; color: #d35400; }
    .card-desc { font-size: 0.85rem; color: #666; line-height: 1.5; flex: 1; margin-bottom: 0.75rem; }
    .card-footer { border-top: 1px solid #f0ebe5; padding-top: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    .card-actions { display: flex; gap: 0.4rem; }
    .btn-sm {
      padding: 0.28rem 0.65rem; border-radius: 0.45rem;
      border: none; cursor: pointer; font-size: 0.75rem; font-weight: 600;
      transition: all 0.15s;
    }
    .btn-view { background: var(--brand); color: white; }
    .btn-view:hover { background: var(--brand-dark); }
    .btn-edit { background: #e8f4fd; color: #2980b9; }
    .btn-edit:hover { background: #d0eaf9; }
    .btn-del { background: #fee; color: var(--brand-dark); }
    .btn-del:hover { background: #fcc; }
    .card-source { font-size: 0.72rem; color: #bbb; text-decoration: none; }
    .card-source:hover { color: var(--brand); }

    /* Empty */
    .empty { grid-column: 1/-1; text-align: center; padding: 4rem 2rem; color: #bbb; }
    .empty .icon { font-size: 4rem; margin-bottom: 1rem; }

    /* Loading */
    .loading { grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--muted); font-size: 1.1rem; }

    /* Toast */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #2d2d2d; color: white;
      padding: 0.75rem 1.2rem; border-radius: 0.6rem;
      font-size: 0.88rem; x-index: 9999;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px); opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #27ae60; }
    .toast.error { background: #c0392b; }

    /* ── Modal ── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 500;
      padding: 1rem; overflow-y: auto;
    }
    .overlay.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 2rem; }
    .modal {
      background: var(--surface); border-radius: var(--radius);
      width: 100%; max-width: 540px;
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .modal-head {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: white; padding: 1.1rem 1.4rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-head h2 { font-size: 1.1rem; }
    .btn-x { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; opacity: 0.8; line-height: 1; }
    .btn-x:hover { opacity: 1; }
    .modal-body { padding: 1.4rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .fg { margin-bottom: 0.9rem; }
    .fg label { display: block; font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 0.3rem; }
    .fg input, .fg select, .fg textarea {
      width: 100%; padding: 0.55rem 0.75rem;
      border: 2px solid var(--border); border-radius: 0.5rem;
      font-size: 0.88rem; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--brand); }
    .fg textarea { resize: vertical; min-height: 80px; }
    .modal-foot {
      padding: 0.9rem 1.4rem; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; gap: 0.75rem;
    }
    .btn-primary {
      padding: 0.55rem 1.3rem; background: var(--brand); color: white;
      border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      padding: 0.55rem 1.3rem; background: #f0ebe5; color: #555;
      border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #e0d8d0; }

    /* Detail View */
    .detail-emoji { font-size: 4.5rem; text-align: center; padding: 1.75rem; background: linear-gradient(135deg, #fdf3ee, #fde8df); }
    .detail-content { padding: 1.4rem; }
    .detail-content h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.75rem; }
    .detail-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
    .dsec { margin-bottom: 1.1rem; }
    .dsec h3 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--brand); margin-bottom: 0.45rem; }
    .dsec p { font-size: 0.9rem; color: #444; line-height: 1.6; }
    .dsec ul { list-style: none; }
    .dsec ul li { font-size: 0.88rem; color: #444; padding: 0.2rem 0; }
    .dsec ul li::before { content: '•'; color: var(--brand); margin-right: 0.5rem; }
    .nutr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
    .nutr-item { background: #faf7f4; border-radius: 0.5rem; padding: 0.55rem; text-align: center; }
    .nutr-item .val { font-size: 1.1rem; font-weight: 700; color: var(--brand); }
    .nutr-item .lbl { font-size: 0.68rem; color: var(--muted); }
    .dsrc { font-size: 0.75rem; color: #bbb; margin-top: 1rem; }
    .dsrc a { color: var(--brand); text-decoration: none; }
    .dsrc a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Config warning (shown when placeholders aren't replaced) -->
<div id="configBanner" class="hidden">
  ⚠️ <strong>Noch nicht konfiguriert.</strong> Ersetze <code>DEINE_SUPABASE_URL</code> und <code>DEIN_ANON_KEY</code> in dieser Datei mit deinen Supabase-Zugangsdaten. Anleitung: siehe <strong>ANLEITUNG.md</strong>
</div>

<!-- ── LOGIN ── -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">🍽️</div>
    <h1>Robins Kochbuch</h1>
    <p>Passwort eingeben, um fortzufahren</p>
    <div class="form-group">
      <label>Passwort</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">Einloggen</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <header class="app-header">
    <div>
      <h1>🍽️ Essen-Bibliothek</h1>
      <p id="userEmail"></p>
    </div>
    <button class="btn-logout" onclick="doLogout()">Abmelden</button>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Gericht suchen…" oninput="renderCards()">
    </div>
    <div class="tags" id="filterTags">
      <button class="tag active" onclick="setFilter('Alle', this)">Alle</button>
      <button class="tag" onclick="setFilter('Salat', this)">🥗 Salat</button>
      <button class="tag" onclick="setFilter('Pasta', this)">🍝 Pasta</button>
      <button class="tag" onclick="setFilter('Fleisch', this)">🥩 Fleisch</button>
      <button class="tag" onclick="setFilter('Vegetarisch', this)">🥦 Vegetarisch</button>
      <button class="tag" onclick="setFilter('Fitness', this)">💪 Fitness</button>
      <button class="tag" onclick="setFilter('Suppe', this)">🍲 Suppe</button>
      <button class="tag" onclick="setFilter('Frühstück', this)">🌅 Frühstück</button>
      <button class="tag" onclick="setFilter('Dessert', this)">🍰 Dessert</button>
    </div>
    <button class="btn-add" onclick="openAdd()">+ Gericht</button>
  </div>

  <div class="stats" id="statsBar">Lade Gerichte…</div>
  <div class="grid" id="grid"><div class="loading">⏳ Lade Rezepte…</div></div>
</div>

<!-- ── FORM MODAL ── -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">Neues Gericht</h2>
      <button class="btn-x" onclick="closeOverlay('formOverlay')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="fId">
      <div class="row2">
        <div class="fg">
          <label>Emoji</label>
          <input type="text" id="fEmoji" placeholder="🍽️" maxlength="4">
        </div>
        <div class="fg">
          <label>Kategorie</label>
          <select id="fCategory">
            <option>Salat</option><option>Pasta</option><option>Fleisch</option>
            <option>Vegetarisch</option><option>Fitness</option><option>Suppe</option>
            <option>Frøhstück</option><option>Dessert</option><option>Sonstiges</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label>Name des Gerichts *</label>
        <input type="text" id="fName" placeholder="z.B. Burrata mit Rucola">
      </div>
      <div class="fg">
        <label>Kurzbeschreibung</label>
        <input type="text" id="fDesc" placeholder="Ein Satz øber das Gericht">
      </div>
      <div class="fg">
        <label>Zutaten (eine pro Zeile)</label>
        <textarea id="fIngredients" placeholder="1 Burrata&#10;200g Joghurt&#10;..."></textarea>
      </div>
      <div class="fg">
        <label>Zubereitung</label>
        <textarea id="fInstructions" style="min-height:100px" placeholder="Schritt-für-Schritt…"></textarea>
      </div>
      <div class="row2">
        <div class="fg"><label>⏱ Zubereitungszeit</label><input type="text" id="fTime" placeholder="30 Min"></div>
        <div class="fg"><label>👥 Portionen</label><input type="text" id="fPortions" placeholder="2"></div>
      </div>
      <div class="row2">
        <div class="fg"><label>🔥 kcal / Portion</label><input type="number" id="fKcal" placeholder="605"></div>
        <div class="fg"><label>💪 Protein (g)</label><input type="number" id="fProtein" placeholder="30"></div>
      </div>
      <div class="row2">
        <div class="fg"><label>🍞 Kohlenhydrate (g)</label><input type="number" id="fCarbs" placeholder="57"></div>
        <div class="fg"><label>🧈 Fett (g)</label><input type="number" id="fFat" placeholder="26"></div>
      </div>
      <div class="fg">
        <label>🔗 Quelle / Link</label>
        <input type="text" id="fSource" placeholder="https://…">
      </div>
      <div class="fg">
        <label>Quelle Bezeichnung</label>
        <input type="text" id="fSourceLabel" placeholder="z.B. Schmale Schulter Fitness">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeOverlay('formOverlay')">Abbrechen</button>
      <button class="btn-primary" id="saveBtn" onclick="saveRecipe()">💾 Speichern</button>
    </div>
  </div>
</div>

<!-- ── DETAIL MODAL ── -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Rezept-Details</h2>
      <button class="btn-x" onclick="closeOverlay('viewOverlay')">×</button>
    </div>
    <div id="viewContent"></div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeOverlay('viewOverlay')">Schließen</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ══════════════════════════════════════════════
  //  KONFIGURATION – hier deine Supabase-Daten
  // ══════════════════════════════════════════════
  const SUPABASE_URL = 'https://tlclufnnahgcwhmogkld.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsY2x1Zm5uYWhnY3dobW9na2xkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzY2NDQsImV4cCI6MjA4OTUxMjY0NH0.Bv6isYYeP5DbuEcKff6OUD4S9OsT0uxmRgIDsfRVXww';

  // ══════════════════════════════════════════════

  let supabase, recipes = [], currentFilter = 'Alle', editingId = null;

  // ── Init ──
  function init() {
    if (SUPABASE_URL.includes('DEINE') || SUPABASE_ANON_KEY.includes('DEIN_')) {
      document.getElementById('configBanner').classList.remove('hidden');
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    checkSession();
  }

  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) showApp(session.user);
    else showLogin();
  }

  // ── Auth ──
  function showLogin() {
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }

  function showApp(user) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('userEmail').textContent = '';
    loadRecipes();
  }

  async function doLogin() {
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');

    if (!password) { showLoginError('Bitte Passwort eingeben.'); return; }

    btn.disabled = true; btn.textContent = 'Einloggen…';
    errEl.style.display = 'none';

    const { data, error } = await supabase.auth.signInWithPassword({
      email: 'zugang@robins-kochbuch.app',
      password
    });
    if (error) {
      showLoginError('Falsches Passwort. Bitte nochmal versuchen.');
      btn.disabled = false; btn.textContent = 'Einloggen';
    } else {
      showApp(data.user);
    }
  }

  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg; el.style.display = 'block';
  }

  async function doLogout() {
    await supabase.auth.signOut();
    showLogin();
    recipes = [];
  }

  // Enter-Taste im Login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('loginPage').style.display !== 'none') doLogin();
  });

  // ── Data ──
  async function loadRecipes() {
    document.getElementById('grid').innerHTML = '<div class="loading">⏳ Lade Rezepte…</div>';
    const { data, error } = await supabase.from('recipes').select('*').order('created_at', { ascending: true });
    if (error) { showToast('Fehler beim Laden: ' + error.message, 'error'); return; }
    recipes = data || [];
    renderCards();
  }

  // ── Filters ──
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    renderCards();
  }

  // ── Render ──
  function renderCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = recipes.filter(r => {
      const mf = currentFilter === 'Alle' || r.category === currentFilter;
      const ms = !q || r.name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q);
      return mf && ms;
    });

    document.getElementById('statsBar').textContent = `${filtered.length} von ${recipes.length} Gerichten`;

    if (filtered.length === 0) {
      document.getElementById('grid').innerHTML = `<div class="empty"><div class="icon">🍽️</div><p>Keine Gerichte gefunden.<br>Füge dein erstes Rezept hinzu!</p></div>`;
      return;
    }

    document.getElementById('grid').innerHTML = filtered.map(r => `
      <div class="card">
        <div class="card-emoji">${r.emoji || '🍽️'}|/div>
        <div class="card-body">
          <div class="card-name">${esc(r.name)}</div>
          <div class="card-meta">
            <span class="badge b-cat">${esc(r.category || '')}</span>
            ${r.time_minutes ? `<span class="badge b-time">⏱ ${esc(r.time_minutes)}</span>` : ''}
            ${r.kcal ? `<span class="badge b-kcal">🔥 ${r.kcal} kcal</span>` : ''}
            ${r.protein ? `<span class="badge b-prot">💪 ${r.protein}g</span>` : ''}
          </div>
          <div class="card-desc">${esc(r.description || '')}</div>
          <div class="card-footer">
            <div class="card-actions">
              <button class="btn-sm btn-view" onclick="openView('${r.id}')">Details</button>
              <button class="btn-sm btn-edit" onclick="openEdit('${r.id}')">✏️</button>
              <button class="btn-sm btn-del" onclick="deleteRecipe('${r.id}', event)">🗑</button>
            </div>
            ${r.source_url ? `<a class="card-source" href="${esc(r.source_url)}" target="_blank" rel="noopener">Quelle 🔗</a>` : ''}
          </div>
        </div>
      </div>`).join('');
  }

  // ── Detail View ──
  function openView(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
    const nutr = (r.kcal || r.protein || r.carbs || r.fat);
    document.getElementById('viewContent').innerHTML = `
      <div class="detail-emoji">${r.emoji || '🍽️'}</div>
      <div class="detail-content">
        <h2>${esc(r.name)}</h2>
        <div class="detail-badges">
          <span class="badge b-cat">${esc(r.category || '')}</span>
          ${r.time_minutes ? `<span class="badge b-time">⏱ ${esc(r.time_minutes)}</span>` : ''}
          ${r.portions ? `<span class="badge b-kcal">👥 ${esc(r.portions)} Portionen</span>` : ''}
        </div>
        ${r.description ? `<div class="dsec"><h3>Beschreibung</h3><p>${esc(r.description)}</p></div>` : ''}
        ${ings.length ? `<div class="dsec"><h3>Zutaten</h3><ul>${ings.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>` : ''}
        ${r.instructions ? `<div class="dsec"><h3>Zubereitung</h3><p>${esc(r.instructions).replace(/\n/g,'<br>')}</p></div>` : ''}
        ${nutr ? `<div class="dsec"><h3>Nährwerte pro Portion</h3><div class="nutr-grid">
          ${r.kcal ? `<div class="nutr-item"><div class="val">${r.kcal}</div><div class="lbl">kcal</div></div>` : ''}
          ${r.protein ? `<div class="nutr-item"><div class="val">${r.protein}g</div><div class="lbl">Protein</div></div>` : ''}
          ${r.carbs ? `<div class="nutr-item"><div class="val">${r.carbs}g</div><div class="lbl">Kojlenhydrate</div></div>` : ''}
          ${r.fat ? `<div class="nutr-item"><div class="val">${r.fat}g</div><div class="lbl">Fett</div></div>` : ''}
        </div></div>` : ''}
        ${r.source_url ? `<div class="dsrc">Quelle: <a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_label || r.source_url)}</a></div>` : ''}
      </div>`;
    openOverlay('viewOverlay');
  }

  // ── Add / Edit ──
  function openAdd() {
    editingId = null;
    document.getElementById('formTitle').textContent = '+ Neues Gericht';
    clearForm();
    document.getElementById('fEmoji').value = '🍽️';
    openOverlay('formOverlay');
  }

  function openEdit(id) {
    const r = recipes.find(x => x.id === id);
    if (!r) return;
    editingId = id;
    document.getElementById('formTitle').textContent = '✏️ Gericht bearbeiten';
    document.getElementById('fId').value = r.id;
    document.getElementById('fEmoji').value = r.emoji || '';
    document.getElementById('fName').value = r.name || '';
    document.getElementById('fCategory').value = r.category || 'Salat';
    document.getElementById('fDesc').value = r.description || '';
    document.getElementById('fIngredients').value = (r.ingredients || []).join('\n');
    document.getElementById('fInstructions').value = r.instructions || '';
    document.getElementById('fTime').value = r.time_minutes || '';
    document.getElementById('fPortions').value = r.portions || '';
    document.getElementById('fKcal').value = r.kcal || '';
    document.getElementById('fProtein').value = r.protein || '';
    document.getElementById('fCarbs').value = r.carbs || '';
    document.getElementById('fFat').value = r.fat || '';
    document.getElementById('fSource').value = r.source_url || '';
    document.getElementById('fSourceLabel').value = r.source_label || '';
    openOverlay('formOverlay');
  }

  function clearForm() {
    ['fId','fEmoji','fName','fDesc','fIngredients','fInstructions','fTime','fPortions','fKcal','fProtein','fCarbs','fFat','fSource','fSourceLabel'].forEach(id => {
      document.getElementById(id).value = '';
    });
  }

  async function saveRecipe() {
    const name = document.getElementById('fName').value.trim();
    if (!name) { showToast('Bitte einen Namen eingeben.', 'error'); return; }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Speichern…';

    const payload = {
      emoji: document.getElementById('fEmoji').value || '🍽️',
      name,
      category: document.getElementById('fCategory').value,
      description: document.getElementById('fDesc').value,
      ingredients: document.getElementById('fIngredients').value.split('\n').map(l=>l.trim()).filter(Boolean),
      instructions: document.getElementById('fInstructions').value,
      time_minutes: document.getElementById('fTime').value,
      portions: document.getElementById('fPortions').value,
      kcal: parseInt(document.getElementById('fKcal').value) || null,
      protein: parseInt(document.getElementById('fProtein').value) || null,
      carbs: parseInt(document.getElementById('fCarbs').value) || null,
      fat: parseInt(document.getElementById('fFat').value) || null,
      source_url: document.getElementById('fSource').value,
      source_label: document.getElementById('fSourceLabel').value,
    };

    let error;
    if (editingId) {
      ({ error } = await supabase.from('recipes').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabase.from('recipes').insert([payload]));
    }

    btn.disabled = false; btn.textContent = '💾 Speichern';

    if (error) { showToast('Fehler: ' + error.message, 'error'); return; }
    showToast(editingId ? 'Gericht aktualisiert ✓' : 'Gericht gespeichert ✓', 'success');
    closeOverlay('formOverlay');
    loadRecipes();
  }

  async function deleteRecipe(id, e) {
    e.stopPropagation();
    if (!confirm('Gericht wirklich löschen?')) return;
    const { error } = await supabase.from('recipes').delete().eq('id', id);
    if (error) { showToast('Fehler: ' + error.message, 'error'); return; }
    showToast('Gericht gelöscht', 'success');
    loadRecipes();
  }

  // ── Overlay helpers ──
  function openOverlay(id) { document.getElementById(id).classList.add('open'); }
  function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

  // ── Toast ──
  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── XSS protection ──
  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
